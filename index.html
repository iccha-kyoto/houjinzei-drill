},{"t":"の圧縮基礎取得価額。建物Dの32,600,000は取得価額30,000,000＋購入手数料"},{"b":"2,600,000"},{"t":"。特別勘定にも"},{"b":"同じ"},{"t":"差益割合を掛ける。繰入不足額は"},{"b":"切捨て"},{"t":"（例：4,800,000−5,000,000＝△200,000→調整なし）。"}]},{"title":"収用の補償金の区分と経費補償金のゼロ止め（収用－2・収用－3）","seg":[{"t":"圧縮記帳・特別控除の対象になるのは"},{"b":"対価補償金"},{"t":"だけ。"},{"b":"経費補償金"},{"t":"（移転費・休業補償等）と"},{"b":"収益補償金"},{"t":"は対象外で益金のまま。ただし経費補償金は譲渡経費の補填なので、"},{"b":"譲渡経費"},{"t":"と相殺する。譲渡経費−経費補償金が"},{"b":"マイナス"},{"t":"になるときは"},{"b":"0"},{"t":"で止め、余った経費補償金を対価補償金から"},{"b":"引かない"},{"t":"。例：譲渡経費6,000,000−経費補償金8,000,000＜0→譲渡経費"},{"b":"0"},{"t":"、差引対価補償金は123,000,000−0＝"},{"b":"123,000,000"},{"t":"。余り2,000,000は"},{"b":"益金"},{"t":"のまま。→経費補償金は「実際に払った譲渡経費を打ち消すところまで」しか働かない（"},{"b":"支出した金額の範囲内"},{"t":"）。逆に経費補償金のほうが少なければ、賄いきれなかった"},{"b":"自腹"},{"t":"部分だけが差引対価補償金の控除項目になる。この相殺は"},{"b":"特別控除"},{"t":"の譲渡益計算でも同じ（例：譲渡経費1,350,000−経費補償金200,000＝1,150,000）。"}]},{"title":"収用等の特別控除（措法65の2）：5,000万円は暦年で判定（収用－3・収用－4）","seg":[{"t":"損金算入額＝"},{"b":"譲渡益"},{"t":"と"},{"b":"5,000万円"},{"t":"のいずれか"},{"b":"低い"},{"t":"金額。5,000万円は無条件に引ける額では"},{"b":"ない"},{"t":"。この5,000万円は"},{"b":"暦年"},{"t":"（1/1〜12/31）を通ずる限度額であり、"},{"b":"事業年度"},{"t":"単位では"},{"b":"ない"},{"t":"。例（収用－3）：前期R9.2.14の譲渡で20,000,000を控除済み→当期R9.10.30のA土地の控除限度額は50,000,000−20,000,000＝"},{"b":"30,000,000"},{"t":"（事業年度は違うが、どちらも"},{"b":"令和9年"},{"t":"だから枠を共有）。例（収用－4）：R8.1/30のA土地とR8.4/15のB土地は"},{"b":"同一暦年"},{"t":"→A土地の控除限度額＝50,000,000−13,700,000＝"},{"b":"36,300,000"},{"t":"。特別勘定を戻し入れて当期に適用する場合でも、枠の判定は"},{"b":"収用等（譲渡）のあった年"},{"t":"で行う（適用時ではない）。圧縮記帳との排他は"},{"b":"同一事業年度かつ同一暦年"},{"t":"に譲渡した資産どうし。→収用－3はA土地（令和9年・特別控除）とB土地（令和10年・圧縮記帳）で"},{"b":"暦年が違う"},{"t":"ため、同一事業年度でも"},{"b":"両方"},{"t":"使える。他の特別控除（措法65の3〜65の5の2）と合わせて年"},{"b":"5,000万円"},{"t":"が上限（措法65の6）。"}]},{"title":"収用の特別控除が社外流出で、圧縮記帳が留保である理由","seg":[{"t":"判定基準は一つ。その調整が会計上の純資産と税務上の純資産に"},{"b":"差"},{"t":"を作るかどうか。"},{"b":"圧縮記帳"},{"t":"：代替資産という"},{"b":"受け皿"},{"t":"が残り、その帳簿価額を税務上だけ下げるので差が生じる→別表五(一)に乗る→"},{"b":"留保"},{"t":"。この差は以後の"},{"b":"償却費"},{"t":"や売却時の"},{"b":"原価"},{"t":"が小さくなることで必ず戻ってくる＝"},{"b":"課税の繰延べ"},{"t":"＝"},{"b":"一時差異"},{"t":"。"},{"b":"特別控除"},{"t":"：資産はもう手元になく、補償金は現金で受け取り、譲渡益も全額帳簿に計上済み。代替資産も取得していない。→帳簿価額を下げる"},{"b":"受け皿がない"},{"t":"ので差が生じない。そして二度と"},{"b":"戻らない"},{"t":"＝"},{"b":"永久差異"},{"t":"→"},{"b":"社外流出"},{"t":"（減算は※）。→「"},{"b":"代替資産を買ったか買わなかったか"},{"t":"」が、そのまま「留保か社外流出か」に直結する。例（収用－3の別表四）：収用等の特別控除額28,850,000（減算・社外流出※）／C土地圧縮積立金60,000,000（減算・留保）／C土地圧縮積立金超過額2,600,000（加算・留保）。"}]},{"title":"特定株式投資信託が「非支配目的株式等」として20%になる理由（措法67の6）","seg":[{"t":"特定株式投資信託（ETF）は、信託財産を"},{"b":"株式のみ"},{"t":"に対する投資として運用する証券投資信託。分配金は100%が株式の配当に由来し、その配当は発行会社段階で"},{"b":"法人税"},{"t":"を負担済み＝株式を直接持つのと"},{"b":"同じ"},{"t":"構造。そこで「中身を"},{"b":"見通して"},{"t":"、直接持っていたらどう扱われるか」に合わせる。指数連動ETFは数百銘柄に分散しているので、各銘柄の実質持株割合は"},{"b":"5%以下"},{"t":"→"},{"b":"非支配目的株式等"},{"t":"→"},{"b":"20%"},{"t":"。裏づけ："},{"b":"外国株価指数連動型"},{"t":"は対象から"},{"b":"除く"},{"t":"。外国法人の配当は日本の法人税を負担しておらず、排除すべき"},{"b":"二重課税"},{"t":"がないから（法23①も外国法人からの配当を除外）。→この除外は「中身の株式が日本の法人税を負担しているか」で線を引いている証拠。一方、特定株式投資信託"},{"b":"以外"},{"t":"の証券投資信託は、信託財産に公社債等が"},{"b":"混在"},{"t":"して配当部分を切り分けられないため"},{"b":"対象外"},{"t":"（ゼロ）。判定手順：①特定株式投資信託か→NOなら対象外／②YESなら外国株価指数連動型か→YESなら対象外、NOなら"},{"b":"20%"},{"t":"。※"},{"b":"持株割合"},{"t":"は与えられても使わない。条文が非支配目的と"},{"b":"みなす"},{"t":"と決め打ちしている。"}]},{"title":"寄附金だけが限度額を循環する：支出寄附金を動かしたら限度額も動く","seg":[{"t":"寄附金支出前所得金額＝仮計＋"},{"b":"支出寄附金の額"},{"t":"。つまり支出寄附金は、自分自身の"},{"b":"限度額"},{"t":"の計算基礎に"},{"b":"足し戻される"},{"t":"。→別表四の他の項目（交際費・役員給与・償却超過額）は"},{"b":"一方通行"},{"t":"だが、寄附金だけ"},{"b":"一周して戻る"},{"t":"。だから「相殺されるから所得に影響なし」という普段の感覚が"},{"b":"通用しない"},{"t":"。例：低額譲渡の寄附金を時価基準10,000,000ではなく帳簿上の譲渡損8,000,000で拾った場合、支出寄附金と国等への寄附金から同額が消えて一見相殺されるが、寄附金支出前所得が2,000,000"},{"b":"小さく"},{"t":"なり、一般限度額が2,000,000×2.5/100×1/4＝"},{"b":"12,500"},{"t":"縮む→損金不算入額が12,500"},{"b":"増え"},{"t":"、所得も12,500"},{"b":"増える"},{"t":"。→寄附金を小さく拾うと所得が"},{"b":"増える"},{"t":"（控除枠を自分で削るから）。方向が直感と"},{"b":"逆"},{"t":"。相手が国等でなければ差は約"},{"b":"2,000,000"},{"t":"に拡大する。チェックポイント：未払寄附金否認・仮払寄附金認定損・低額譲渡・役員給与への振替など、"},{"b":"支出寄附金の集計を動かす論点"},{"t":"に当たったら、相殺で終わらせず"},{"b":"限度額"},{"t":"まで引き直す。"}]},{"title":"特定資 3,800,000"},{"t":"。違うのは"},{"b":"分母"},{"t":"だけ。なぜ違うか：収用には"},{"b":"経費補償金"},{"t":"という制度があって経費も補償されるので"},{"b":"相殺"},{"t":"して純額を出す。買換えは普通の"},{"b":"売買"},{"t":"で経費は"},{"b":"自腹"},{"t":"なので、売値を削る理由がない。合言葉は「"},{"b":"補償は相殺、売買は総額"},{"t":"」。見分け方：解答に「"},{"b":"差引"},{"t":"対価補償金」の行があるのが収用（"},{"b":"4"},{"t":"ステップ）。買換えは(1)経費→(2)差益割合の"},{"b":"3"},{"t":"ステップ。「差引譲渡対価」という用語は"},{"b":"存在しない"},{"t":"。"}]},{"title":"買換えの面積制限：5倍（買換－1）","seg":[{"t":"既成市街地等内の買換え等では、買換資産である"},{"b":"土地等"},{"t":"の面積が譲渡資産の土地等の面積の"},{"b":"5倍"},{"t":"を超えるとき、超える部分は買換資産に"},{"b":"該当しない"},{"t":"。掛けるのは"},{"b":"取得価額"},{"t":"ベース（購入代価＋"},{"b":"購入手数料"},{"t":"）であって、購入代価だけでは"},{"b":"ない"},{"t":"。例：C土地の取得価額＝239,400,000＋600,000＝240,000,000。240,000,000×（250㎡×"},{"b":"5"},{"t":"）÷1,500㎡＝"},{"b":"200,000,000"},{"t":"が圧縮基礎取得価額の上限。費用計上した購入手数料600,000は別表四で"},{"b":"土地計上もれ"},{"t":"（加算・留保）。建物分の購入手数料は"},{"b":"償却費"},{"t":"に合流させる。"}]},{"title":"買換えの圧縮特別勘定と順送り（買換－1・措法65の8）","seg":[{"t":"買換えも収用と同じ"},{"b":"順送り"},{"t":"。譲渡対価440,000,000→C土地"},{"b":"200,000,000"},{"t":"（残240,000,000）→D建物"},{"b":"100,000,000"},{"t":"（残"},{"b":"140,000,000"},{"t":"）→使い残しが特別勘定の圧縮基礎取得価額。翌期取得見込みの機械装置150,000,000と比べて"},{"b":"少ない"},{"t":"方＝"},{"b":"140,000,000"},{"t":"。繰入限度額＝140,000,000×0.81×"},{"b":"80%"},{"t":"＝"},{"b":"90,720,000"},{"t":"。繰入超過額＝100,000,000−90,720,000＝"},{"b":"9,280,000"},{"t":"（加算・留保）。※解答の〔圧縮特別勘定〕の冒頭に出る「経費5,920,000」「差益割合0.81」は、圧縮記帳と同じものの"},{"b":"再掲"},{"t":"。経費5,920,000は特別勘定の計算式に"},{"b":"登場しない"},{"t":"（0.81を作った時点で仕事は終わっている）。実際に使うのは"},{"b":"差益割合"},{"t":"だけ。→特別勘定で新しく考えるのは"},{"b":"圧縮基礎取得価額"},{"t":"（使い残し）からで、前の2行は"},{"b":"書き写す"},{"t":"だけ。収用－2の解答も同じ構造。"}]},{"title":"貸倒損失の3類型（基通9-6-1・9-6-2・9-6-3）","seg":[{"b":"法律上"},{"t":"の貸倒れ（9-6-1）：更生計画・再生計画の"},{"b":"認可決定"},{"t":"、特別清算に係る協定の認可、債権者集会の協議決定、"},{"b":"書面"},{"t":"による債務免除。対象は"},{"b":"金銭債権全般"},{"t":"。"},{"b":"損金経理不要"},{"t":"（当然に損金）。"},{"b":"全額"},{"t":"（備忘価額不要）。"},{"b":"事実上"},{"t":"の貸倒れ（9-6-2）：債務者の資産状況・支払能力等からみて"},{"b":"全額"},{"t":"が回収できないことが明らか。対象は"},{"b":"金銭債権全般"},{"t":"。"},{"b":"損金経理が必要"},{"t":"。"},{"b":"全額"},{"t":"（ は一致するのでこの問題でもどちらも70,000,000だが、ズレる資料が来たら算式には"},{"b":"借地権の価額"},{"t":"を使う。→分母はどちらも"},{"b":"設定直前"},{"t":"の土地の価額。賃貸後の価額を分母にしない。例：(100,000,000−30,000,000)/100,000,000＝70%≧5/10、60,000,000×70,000,000/100,000,000＝"},{"b":"42,000,000"},{"t":"→"},{"b":"土地帳簿価額認定損"},{"t":"42,000,000（"},{"b":"減算"},{"t":"・留保）。"}]},{"title":"借地権の更新料を支払った場合（借地－1）","seg":[{"t":"令139。損金算入額＝更新直前の借地権の"},{"b":"帳簿価額"},{"t":"×"},{"b":"更新料の額"},{"t":"÷"},{"b":"更新時"},{"t":"の借地権の価額。かつ「その更新料の額は、当該借地権の帳簿価額に"},{"b":"加算"},{"t":"する」→更新料は"},{"b":"資産"},{"t":"計上であって費用ではない。例：12,000,000 × 6,000,000/40,000,000 ＝"},{"b":"1,800,000"},{"t":"。税務上簿価 12,000,000 −1,800,000 ＋6,000,000 ＝"},{"b":"16,200,000"},{"t":"。会社上簿価（旧簿価を全額費用にした場合）12,000,000 −12,000,000 ＋6,000,000 ＝"},{"b":"6,000,000"},{"t":"。差"},{"b":"10,200,000"},{"t":"→"},{"b":"借地権計上もれ"},{"t":"（"},{"b":"加算"},{"t":"・留保）。"}]},{"title":"更新料でなぜ一部しか落とせないのか（借地－1）","seg":[{"t":"更新料は借地権の"},{"b":"一部を買い直した"},{"t":"代金。更新時の価額40,000,000のうち6,000,000＝"},{"b":"15%"},{"t":"を新しく買った。→旧簿価12,000,000のうち"},{"b":"15%"},{"t":"＝1,800,000が"},{"b":"入れ替わった"},{"t":"ので除却、"},{"b":"85%"},{"t":"＝10,200,000は"},{"b":"そのまま残る"},{"t":"。全額落とせない理由は、85%部分には"},{"b":"何も起きていない"},{"t":"から。ゼロでない理由は、15%部分は確かに"},{"b":"入れ替わった"},{"t":"から。→15%部分は簿価"},{"b":"1,800,000"},{"t":"が更新料"},{"b":"6,000,000"},{"t":"に置き換わる。簿価は差引"},{"b":"4,200,000"},{"t":"増える。→15%部分の時価は6,000,000なので含み益"},{"b":"4,200,000"},{"t":"を抱えていたことになるが、ここで"},{"b":"譲渡益は認識しない"},{"t":"（除却＋新規取得であって時価売却ではない）。含み益は借地権の中に"},{"b":"温存"},{"t":"され、将来手放すときに実現する。当期の所得への影響は"},{"b":"損金1,800,000だけ"},{"t":"。→会社の落としすぎ額が10,200,000になるのは、それが"},{"b":"消えたはずのない85%部分そのもの"},{"t":"だから。"}]},{"title":"借地権の2つの制度は同じ骨格（借地－1）","seg":[{"t":"どちらも"},{"b":"資産の簿価のうち入れ替わった割合だけ落とす"},{"t":"制度。割合の作り方だけが違う。"},{"b":"令138"},{"t":"＝"},{"b":"貸す側"},{"t":"（地主）。土地の簿価を落とす。分子＝"},{"b":"借地権の価額"},{"t":"／分母＝設定直前の土地の価額。"},{"b":"令139"},{"t":"＝"},{"b":"借りる側"},{"t":"（借地人）。借地権の簿価を落とす。分子＝"},{"b":"更新料の額"},{"t":"／分母＝更新時の借地権の価額。→分母はどちらも"},{"b":"その資産の時価の全体"},{"t":"、分子は"},{"b":"そのうち動いた部分"},{"t":"。→令138：土地100,000,000のうち70,000,000が借地権になって出ていった→60,000,000×70%＝42,000,000。令139：借地権40,000,000のうち6,000,000を買い直した→12,000,000×15%＝1,800,000。"}]}],"enshu":[{"title":"交換－1　複数の資産の交換","q":"当期（4/1〜3/31）の6月1日に他社との間で次に掲げる資産の交換を行った。\nそれぞれの資産はすべて交換のために取得したものではない。\n\n【交換譲渡資産】\n  土地  交換時の時価 240,000,000  交換直前の帳簿価額 160,000,000\n  建物  交換時の時価  60,000,000  交換直前の帳簿価額  52,000,000\n【交換取得資産】\n  土地  交換時の時価 270,000,000  交換直前の帳簿価額 140,000,000\n  建物  交換時の時価  50,000,000  交換直前の帳簿価額  48,000,000\n\n(注1) 交換譲渡資産・交換取得資産はいずれも当社及び他社において1年以上所有していた。\n(注2) 交換取得資産はいずれも当期の7月10日から交換譲渡資産の譲渡直前の用途と同一の用途に供している。\n(注3) 交換譲渡資産である建物には前期から繰越された償却超過額300,000がある。\n(注4) 交換に当たり支出した譲渡経費1,000,000及び取得経費9,600,000\n      （土地に係るもの8,100,000、建物に係るもの1,500,000）は当期の費用に計上している。\n(注5) 当社は交換取得資産の交換時の時価を取得価額としている。\n\n(2) 交換取得資産である建物は他社において5年間使用された工場用建物（法定耐用年数38年）であり、\n    事業の用に供するに当たり改良費3,000,000を支出し当期の費用に計上している。\n    なお、耐用年数を見積もることは困難である。\n(3) 取得した資産の価額の合計額から譲渡した資産の譲渡直前の帳簿価額の合計額を控除した残額を\n    固定資産売却益として当期の収益に計上しており、また、交付した交換差金20,000,000を当期の費用に計上している。\n(4) 交換取得資産である土地及び建物につきそれぞれ80,000,000及び8,000,000を圧縮損として、\n    建物につき200,000を減価償却費として当期の費用に計上している。\n(5) 償却率（平成19年4月1日以後取得用）　38年…0.027　34年…0.030　33年…0.031","a":"〔交換〕\n(1) 土地\n ① 判定 (イ) 270,000,000 − 240,000,000 = 30,000,000\n         (ロ) 270,000,000 × 20% = 54,000,000\n         (ハ) (イ)≦(ロ)  ∴適用あり\n ② 経費 1,000,000 × 240,000,000/(240,000,000+60,000,000) = 800,000\n ③ 圧縮限度額 270,000,000 − (160,000,000 + 800,000 + 30,000,000) = 79,200,000\n ④ 圧縮超過額 80,000,000 − 79,200,000 = 800,000\n(2) 建物\n ① 判定 (イ) 60,000,000 − 50,000,000 = 10,000,000\n         (ロ) 60,000,000 × 20% = 12,000,000\n         (ハ) (イ)≦(ロ)  ∴適用あり\n ② 経費 1,000,000 × 60,000,000/(240,000,000+60,000,000) = 200,000\n ③ 圧縮限度額\n    50,000,000 − (52,000,000 + 300,000 + 200,000) × 50,000,000/(50,000,000+10,000,000) = 6,250,000\n ④ 圧縮超過額 8,000,000 − 6,250,000 = 1,750,000\n\n〔減価償却〕\n(1) 見積耐用年数 (38年−5年) + 5年×20% = 34年\n(2) 償却限度額 (50,000,000 + 1,500,000 + 3,000,000 − 6,250,000) × 0.030 × 9/12 = 1,085,625\n(3) 償却超過額 (200,000 + 1,500,000 + 1,750,000 + 3,000,000) − 1,085,625 = 5,364,375\n\n〔別表四〕\n 建物減価償却超過額認容   300,000（減算・留保）\n 土地計上もれ           8,100,000（加算・留保）\n 土地圧縮超過額           800,000（加算・留保）\n 建物減価償却超過額     5,364,375（加算・留保）\n\n◆ポイント\n ・種類ごとに土俵を分ける。土地は差金30,000,000を支払、建物は10,000,000を受取。\n   全体のネット20,000,000はどこにも出てこない。\n ・20%の分母は「いずれか多い方」。土地は取得資産、建物は譲渡資産が多い方。\n ・譲渡経費は譲渡資産の時価で按分（分母300,000,000）。取得経費は圧縮限度額に入れず取得価額へ。\n ・月数は事業供用日（7/10）から9か月。交換日の6/1ではない。"},{"title":"収用－2　圧縮記帳と特別勘定","q":"当期（4/1〜3/31）中の5月10日に公共施設の敷地として国から土地収用法の規定に基づき\n次の資産の買取りの申出があったので当期の7月18日に譲渡した。\n\n(2) 譲渡資産は土地A（譲渡直前帳簿価額200,000,000、面積500㎡）の一部100㎡と\n    建物B（譲渡直前帳簿価額21,000,000）であり、譲渡により対価補償金123,000,000、\n    経費補償金8,000,000の交付を受け当期の収益に計上している。\n    また、土地A及び建物Bの譲渡直前帳簿価額のうち譲渡対応分を損金経理している。\n    なお、譲渡経費は損金経理により6,000,000を支出しており、建物Bには繰越償却超過額500,000がある。\n(3) 上記の対価補償金により代替資産として土地C及び工場用建物Dを取得しており、\n    土地Cの取得価額は80,400,000（当期の8月30日に取得、面積520㎡）である。\n    また、工場用建物Dの取得価額は30,000,000（事業供用日は当期の3月29日、耐用年数38年、\n    定額法償却率0.027）であり、購入手数料2,600,000を支払い損金経理している。\n    なお、当社は対価補償金の残額をもって翌期において機械を取得する見込みである。\n(4) 当社は土地C及び工場用建物Dについて圧縮損として45,000,000及び17,000,000、\n    特別勘定として4,800,000、工場用建物Dの減価償却費として50,000を損金経理している。\n(5) 差益割合は一括して計算するものとする。","a":"〔収用等の圧縮記帳〕\n(1) 譲渡経費 6,000,000 − 8,000,000 ＜ 0  ∴0\n(2) 差引対価補償金 123,000,000 − 0 = 123,000,000\n(3) 差益割合 {123,000,000 − (40,000,000 + 21,500,000)} / 123,000,000 = 0.5\n    (注1) 200,000,000 × 100㎡/500㎡ = 40,000,000\n    (注2) 21,000,000 + 500,000 = 21,500,000\n(4) 圧縮基礎取得価額\n ① 土地C       123,000,000 ＞ 80,400,000  ∴80,400,000\n ② 工場用建物D 123,000,000 − 80,400,000 = 42,600,000\n                ＞ 30,000,000 + 2,600,000 = 32,600,000  ∴32,600,000\n(5) 圧縮限度額 ① 80,400,000 × 0.5 = 40,200,000\n               ② 32,600,000 × 0.5 = 16,300,000\n(6) 圧縮超過額 ① 45,000,000 − 40,200,000 = 4,800,000\n               ② 17,000,000 − 16,300,000 =   700,000\n\n〔減価償却〕\n(1) 償却限度額 (32,600,000 − 16,300,000) × 0.027 × 1/12 = 36,675\n(2) 償却超過額 (50,000 + 700,000 + 2,600,000) − 36,675 = 3,313,325\n\n〔圧縮特別勘定〕\n(1)〜(3) 譲渡経費 0 ／ 差引対価補償金 123,000,000 ／ 差益割合 0.5（圧縮記帳からの再掲）\n(4) 圧縮基礎取得価額 42,600,000 − 32,600,000 = 10,000,000\n(5) 繰入限度額 10,000,000 × 0.5 = 5,000,000\n(6) 繰入超過額 4,800,000 − 5,000,000 = △200,000（切捨）\n\n〔別表四〕\n 建物B減価償却超過額認容       500,000（減算・留保）\n 土地C圧縮超過額             4,800,000（加算・留保）\n 工場用建物D減価償却超過額   3,313,325（加算・留保）\n\n◆ポイント\n ・経費補償金8,000,000は譲渡経費6,000,000を打ち消すところまで。マイナスにせず0で止める。\n   余った2,000,000は対価補償金から引かない（益金のまま）。\n ・圧縮基礎取得価額は「取得価額」と「補償金の未使用残額」の少ない方。残額は毎回更新する。\n ・特別勘定は使い残し。割合は圧縮記帳と同じ。繰入不足は切捨てで調整なし。\n ・月数は事業供用日（3/29）から1か月。"},{"title":"収用－3　特別控除と圧縮記帳","q":"当期は令和9年4月1日から令和10年3月31日まで。\n\n(1) 当期中において土地収用法の規定に基づき国に対して譲渡した資産の状況は次のとおりであり、\n    これら以外に収用されたものはない。取得した補償金を補償金収入として収益に計上し、\n    譲渡土地の譲渡直前の帳簿価額及び譲渡に要した経費の額をそれぞれ譲渡原価及び譲渡経費として\n    当期の費用に計上している。それぞれの資産は買取りの申出があった日から6月を経過した日までに\n    譲渡されている。\n\n  A土地 譲渡 R9.10.30  譲渡直前帳簿価額 20,000,000\n        対価補償金 50,000,000 ／ 経費補償金   200,000 ／ 譲渡経費 1,350,000\n  B土地 譲渡 R10.3.3   譲渡直前帳簿価額 16,200,000\n        対価補償金 91,000,000 ／ 経費補償金 3,480,000 ／ 譲渡経費 4,480,000\n\n(2) A土地の取引に関して措置法65条の2《収用換地等の場合の所得の特別控除》の適用を受ける。\n(3) B土地の対価補償金をもって当期の3月15日に代替資産であるC土地70,000,000を取得すると同時に\n    事業の用に供している。\n(4) C土地を代替資産として措置法64条の適用を受けるため、当期の確定した決算において\n    圧縮積立金として積み立てる方法により経理した金額は60,000,000である。\n    なお、翌期以降において代替資産を取得する見込みはない。\n(5) 前期の2月14日にも収用換地等による資産の譲渡を行い、譲渡益20,000,000につき\n    措置法65条の2の規定の適用を受けている。","a":"〔収用等の特別控除額〕（A土地）\n(1) 譲渡益\n ① 譲渡経費 1,350,000 − 200,000 = 1,150,000\n ② 譲渡益   50,000,000 − (20,000,000 + 1,150,000) = 28,850,000\n(2) 控除限度額 50,000,000 − 20,000,000 = 30,000,000\n(3) 特別控除額 (1)＜(2)  ∴28,850,000\n\n〔収用等の圧縮記帳〕（C土地）\n(1) 譲渡経費 4,480,000 − 3,480,000 = 1,000,000\n(2) 差引対価補償金 91,000,000 − 1,000,000 = 90,000,000\n(3) 差益割合 (90,000,000 − 16,200,000) / 90,000,000 = 0.82\n(4) 圧縮基礎取得価額 90,000,000 ＞ 70,000,000  ∴70,000,000\n(5) 圧縮限度額 70,000,000 × 0.82 = 57,400,000\n(6) 圧縮超過額 60,000,000 − 57,400,000 = 2,600,000\n\n〔別表四〕\n 収用等の特別控除額      28,850,000（減算・社外流出※）\n C土地圧縮積立金         60,000,000（減算・留保）\n C土地圧縮積立金超過額    2,600,000（加算・留保）\n\n◆ポイント\n ・A土地の収用はR9.10.30（令和9年）、B土地はR10.3.3（令和10年）。\n   同一事業年度でも暦年が違うので、A土地は特別控除・B土地は圧縮記帳を併用できる。\n ・控除限度額から引く20,000,000は前期R9.2.14の譲渡分。事業年度は違うが同じ令和9年。\n ・経費補償金との相殺は特別控除の譲渡益計算でも同じ。\n ・積立金方式なので圧縮積立金は減算・留保、超過額は加算・留保。\n   特別控除だけが社外流出（簿価を下げる受け皿がないため）。"},{"title":"収用－4　特別勘定設定後の特別控除","q":"当期は令和9年4月1日から令和10年3月31日まで。\n\n(1) 令和8年1月30日に当社の有するA土地が、土地収用法の規定に基づき公共施設の建設用地として\n    甲市に買取られ対価補償金を取得したが、令和8年3月期において代替資産の取得がなされなかったので、\n    税務上適正額38,000,000を損金経理により特別勘定として繰入れていた。\n(2) 上記の取引について、指定期間中に代替資産の取得は行われなかったため、\n    措置法65条の2《収用換地等の場合の所得の特別控除》の規定の適用を受けるものとする。\n    なお、当期においてその特別勘定の全額を戻入れ収益に計上している。\n(3) 令和8年4月15日にB土地（平成13年4月1日に26,250,000で取得し同額を帳簿価額に付している。）が、\n    土地収用法に基づき補償金40,800,000（うち経費補償金800,000）で国に買取られ、\n    前期において補償金と譲渡直前帳簿価額との差額を収益に計上するとともに\n    譲渡経費850,000を支払い損金経理した。\n(4) 前期においてB土地の譲渡益部分（税務上適正額、各自算定）について\n    措置法65条の2の規定の適用を受けている。\n(5) 当社は、A土地及びB土地以外に収用された資産はない。","a":"〔収用等の特別控除額〕（A土地）\n(1) 特別勘定金額 38,000,000\n(2) 控除限度額 50,000,000 − 13,700,000 = 36,300,000\n    (注) B土地\n      ① 譲渡益\n        (イ) 譲渡経費 850,000 − 800,000 = 50,000\n        (ロ) 譲渡益 (40,800,000 − 800,000) − (26,250,000 + 50,000) = 13,700,000\n      ② 控除限度額 50,000,000\n      ③ 特別控除額 ①＜②  ∴13,700,000\n(3) 特別控除額 (1)＞(2)  ∴36,300,000\n\n〔別表四〕\n 収用等の特別控除額 36,300,000（減算・社外流出※）\n\n◆ポイント\n ・特別勘定を全額戻し入れた結果、圧縮記帳の利益を受けていないので特別控除を選び直せる。\n ・A土地の指定期間は R8.4/1〜R10.1/29。当期中に満了して戻入れ。\n ・枠の判定は「適用する年度」ではなく「収用（譲渡）のあった年」。\n   A土地もB土地も令和8年の収用なので、同じ5,000万円を分け合う。\n ・事業年度はA＝R8.3月期、B＝前期、適用＝当期とバラバラでも、暦年が同じなら枠を共有する。\n ・申告要件（別表十(五)）は適用する当期の申告書で満たす必要がある。"},{"title":"買換－1　面積制限と特別勘定","q":"(1) 当期の9月9日に既成市街地等内に所在するA土地（令和5年9月6日に58,800,000で取得、面積250㎡）\n    及びA土地の上に存するB建物（令和5年9月6日に取得、譲渡直前帳簿価額18,130,000。\n    このほか繰越償却超過額が750,000ある。）を440,000,000（時価相当額）で譲渡し、\n    譲渡対価からA土地及びB建物の譲渡直前帳簿価額を控除した残額を当期の収益に計上している。\n(2) 当期の12月20日にC土地（既成市街地等内に所在する。）及びC土地の上に存するD建物を\n    それぞれ239,400,000及び99,500,000で取得し、翌月8日から事業の用に供している。\n    C土地及びD建物を買換資産として措置法65条の7第1項第2号の適用を受けるため、\n    次の金額を圧縮損として当期の費用に計上するとともに同額を各資産の帳簿価額から直接減額している。\n      C土地  購入代価 239,400,000  圧縮損 140,000,000  面積 1,500㎡\n      D建物  購入代価  99,500,000  圧縮損  70,000,000  耐用年数 38年（注）\n    (注) 減価償却資産の償却方法として定額法を選定し届出を行っている。\n         平成19年4月1日以後取得、耐用年数38年の定額法償却率は0.027。\n(3) 上記(1)(2)に関して次の支出をし、当期の費用に計上している。\n      ① A土地及びB建物の譲渡に際して支払った仲介手数料 5,920,000\n      ② C土地の取得に際して支払った購入手数料             600,000\n      ③ D建物の取得に際して支払った購入手数料             500,000\n(4) D建物につき償却費として当期の費用に計上した金額は100,000である。\n(5) 翌期において既成市街地等内の地域において機械装置を150,000,000で取得する見込みであるため、\n    措置法65条の8の適用により圧縮特別勘定に100,000,000を繰入れ、当期の費用に計上している。\n(6) 差益割合は一括して計算するものとする。\n【参考数値：80%】","a":"〔買換え〕\n(1) 経費 5,920,000\n(2) 差益割合\n    {440,000,000 − (58,800,000 + 18,130,000 + 750,000 + 5,920,000)} / 440,000,000 = 0.81\n(3) 圧縮基礎取得価額\n ① C土地 440,000,000 ＞ 240,000,000 × (250㎡×5)/1,500㎡ = 200,000,000  ∴200,000,000\n          (注) 239,400,000 + 600,000 = 240,000,000\n ② D建物 440,000,000 − 200,000,000 = 240,000,000 ＞ 100,000,000  ∴100,000,000\n          (注) 99,500,000 + 500,000 = 100,000,000\n(4) 圧縮限度額 ① 200,000,000 × 0.81 × 80% = 129,600,000\n               ② 100,000,000 × 0.81 × 80% =  64,800,000\n(5) 圧縮超過額 ① 140,000,000 − 129,600,000 = 10,400,000\n               ②  70,000,000 −  64,800,000 =  5,200,000\n\n〔減価償却〕\n(1) 償却限度額 (100,000,000 − 64,800,000) × 0.027 × 3/12 = 237,600\n(2) 償却超過額 (100,000 + 500,000 + 5,200,000) − 237,600 = 5,562,400\n\n〔圧縮特別勘定〕\n(1) 経費 5,920,000 ／ (2) 差益割合 0.81　※圧縮記帳からの再掲。以降の計算には使わない\n(3) 圧縮基礎取得価額 240,000,000 − 100,000,000 = 140,000,000 ＜ 150,000,000  ∴140,000,000\n(4) 繰入限度額 140,000,000 × 0.81 × 80% = 90,720,000\n(5) 繰入超過額 100,000,000 − 90,720,000 = 9,280,000\n\n〔別表四〕\n B事務所用建物減価償却超過額認容    750,000（減算・留保）\n C土地計上もれ                     600,000（加算・留保）\n C土地圧縮超過額                10,400,000（加算・留保）\n D建物減価償却超過額             5,562,400（加算・留保）\n 圧縮特別勘定繰入超過額          9,280,000（加算・留保）\n\n◆ポイント\n ・参考数値80%は繰延割合。差益割合0.81とは別物。買換えだけに乗る係数。\n ・面積制限の5倍は取得価額（購入代価＋購入手数料＝240,000,000）に掛ける。\n ・差益割合の分母440,000,000は、そのまま順送りの元手になる（経費は分子だけで引く）。\n ・月数は事業供用日（1/8）から3か月。"},{"title":"買換－2　特別償却との関係","q":"(1) 土地の譲渡に関する事項\n    当期の12月10日に既成市街地等内に所有していたA土地（令和3年10月14日に200,000,000で取得し、\n    その後造成の事実はない。）を得意先である甲社に700,000,000（時価相当額）で譲渡し、\n    譲渡対価と譲渡直前帳簿価額の差額を当期の収益に計上している。\n    このA土地の譲渡については、A土地の上に存するB工場用建物（取壊し直前帳簿価額67,875,000、\n    耐用年数38年）を取壊して引渡す契約となっており、その取壊し費用及び譲渡経費の合計額12,125,000\n    並びにB工場用建物の取壊し直前帳簿価額を当期の費用に計上している。\n\n(2) 買換資産に関する事項\n ① 以前から所有していた既成市街地等内の地域にあるC土地の上に当期の1月5日にD工場用建物を取得し、\n    E機械装置を据付けた。当期における減価償却資産の償却状況等は次のとおり。\n      D工場用建物 取得価額 500,000,000 当期償却費 18,962,500 期末帳簿価額 236,037,500\n                  耐用年数 38年 事業供用日 令和10年1月8日\n      E機械装置   取得価額 100,000,000 当期償却費 40,000,000 期末帳簿価額  10,000,000\n                  耐用年数 10年 事業供用日 令和10年1月10日\n    (注1) 減価償却の方法について選定の届出をしていない。平成24年4月1日以後取得の償却率等：\n          定額法 10年…0.100 38年…0.027\n          定率法 10年…償却率0.200 改定0.250 保証率0.06552\n                 38年…償却率0.053 改定0.056 保証率0.01882\n    (注2) E機械装置は措置法42条の6第1項に規定する特定機械装置等に該当する。\n ② A土地を譲渡資産、D工場用建物及びE機械装置を買換資産として措置法65条の7第1項第2号\n    （繰延割合は80%とする）の適用を受けたいと考え、当期においてD工場用建物圧縮損245,000,000\n    及びE機械装置圧縮損50,000,000をそれぞれ当期の費用に計上している。\n    なお、次期以降において買換資産を取得する見込みはない。\n(3) 当社は資本金額1億円（株主は全て個人）の製造業を営む青色申告法人である。","a":"〔買換え〕\n(1) 経費 67,875,000（B建物の取壊し直前帳簿価額）+ 12,125,000（取壊し費用及び譲渡経費）= 80,000,000\n(2) 差益割合 {700,000,000 − (200,000,000 + 80,000,000)} / 700,000,000 = 0.6\n(3) 圧縮基礎取得価額\n ① D工場用建物 700,000,000 ＞ 500,000,000  ∴500,000,000\n ② E機械装置   700,000,000 − 500,000,000 = 200,000,000 ＞ 100,000,000  ∴100,000,000\n(4) 圧縮限度額 ① 500,000,000 × 0.6 × 80% = 240,000,000\n               ② 100,000,000 × 0.6 × 80% =  48,000,000\n(5) 圧縮超過額 ① 245,000,000 − 240,000,000 = 5,000,000\n               ②  50,000,000 −  48,000,000 = 2,000,000\n\n〔減価償却〕\n(1) D工場用建物\n    償却限度額 (500,000,000 − 240,000,000) × 0.027 × 3/12 = 1,755,000\n    償却超過額 (18,962,500 + 5,000,000) − 1,755,000 = 22,207,500\n(2) E機械装置\n ① 判定 (イ) (100,000,000 − 48,000,000) × 0.200 = 10,400,000\n         (ロ) (100,000,000 − 48,000,000) × 0.06552 = 3,407,040\n         (ハ) (イ)≧(ロ)  ∴通常\n ② 償却限度額 (100,000,000 − 48,000,000) × 0.200 × 3/12 = 2,600,000\n ③ 償却超過額 (40,000,000 + 2,000,000) − 2,600,000 = 39,400,000\n\n〔別表四〕\n D工場用建物減価償却超過額 22,207,500（加算・留保）\n E機械装置減価償却超過額   39,400,000（加算・留保）\n\n◆ポイント\n ・E機械装置は買換えの圧縮記帳の適用を受けているため、特別償却の適用は受けられない\n   （措置法間の重複適用はできない）。これが本問の主題。\n ・取壊して引き渡す建物の帳簿価額と取壊し費用は「経費」に入る（交換－2の建物と同じ発想）。\n ・償却方法の届出がないので機械装置は法定償却方法＝定率法。建物は定額法のみ。\n ・圧縮後の帳簿価額に償却率を掛ける。引くのは会社計上額ではなく限度額。"},{"title":"租税公課　確認テスト第二問1（弱点分野）","q":"(1) 当期中における納税充当金の異動状況\n      区分   期首現在額    期中減少額    期中増加額    期末現在額\n      法人税 40,000,000   40,000,000   34,000,000   34,000,000\n      住民税  8,000,000    8,000,000    6,820,000    6,820,000\n      事業税 13,080,400   13,080,400   13,182,000   13,182,000\n      合計   61,080,400   61,080,400   54,002,000   54,002,000\n    (注1) 期中増加額は損金経理により納税充当金勘定に計上した金額である。\n    (注2) 期中減少額は前期分のそれぞれに掲げる税額（すべて本税である）を納付するために取り崩した金額である。\n\n(2) 当期中に租税公課として損金経理した租税等\n    ① 自動車税                                          445,400\n    ② 当社従業員の交通違反に課された罰金                 96,000\n       （全て業務中のものでありその内訳は、使用人分60,000及び役員分36,000である。）\n    ③ 印紙税                                            240,000（他、過怠税12,000）\n    ④ 社会保険料の納付遅延による延滞金                    3,300\n    ⑤ 固定資産税                                      3,000,000\n       （当期の4月15日に納税通知書を受取り、第3期分までの納付は完了している。\n         なお、第4期分750,000については、未払金経理をしている。）\n    ⑥ 事業に係る事業所税                              1,000,000\n       （当期中に申告期限が到来していないため未払金経理している。\n         なお、そのうち200,000は、製造原価に算入している。）\n    ⑦ その他損金となる租税                            1,700,000\n\n(3) 当期中に納付した次の租税については、法人税、住民税及び事業税として損金経理している。\n    ① 当期中間申告分の法人税  33,959,600（うち、延滞税332,800）\n    ② 当期中間申告分の住民税   5,484,800（うち、延滞金 58,500）\n    ③ 当期中間申告分の事業税  10,823,000（うち、延滞金106,000）","a":"〔加算〕\n 損金計上納税充当金   54,002,000（留保）\n 損金計上法人税       33,959,600 − 332,800 = 33,626,800（留保）\n 損金計上住民税        5,484,800 −  58,500 =  5,426,300（留保）\n 損金計上附帯税等      332,800 + 58,500 + 106,000 + 12,000 = 509,300（社外流出）\n 損金計上罰科金           96,000（社外流出）\n 未払事業所税否認      1,000,000 − 200,000 = 800,000（留保）\n\n〔減算〕\n 納税充当金から支出した事業税等の額  13,080,400（留保）\n\n〔調整なし〕\n 自動車税 445,400 ／ 印紙税 240,000 ／ 社会保険料の延滞金 3,300\n 固定資産税 3,000,000（第4期分750,000を含めて全額当期の損金）\n 中間納付事業税 10,717,000（10,823,000 − 106,000）\n\n◆ポイント\n ・罰金は「全て業務中」なので役員分36,000も法人の損金不算入の罰科金。\n   役員給与に振らない（基通9-5-8）。業務外のときに初めて給与になる。\n ・固定資産税は賦課課税方式。賦課決定（納税通知書）のあった日の事業年度に全額損金。\n   未払金経理でも関係ない（基通9-5-1(2)）。加算してはいけない。\n ・事業所税は申告納税方式で申告期限未到来なので否認。ただし製造原価に算入した200,000は\n   未払計上で当期の損金（基通9-5-1(1)なお書き）。否認は800,000だけ。\n ・社会保険料の延滞金は法55⑤の列挙にないので損金算入。\n ・住民税で延滞金を抜く処理ができたら、同じ操作を法人税にも機械的に適用する。"},{"title":"受取配当等　確認テスト第二問4（弱点分野）","q":"(1) 当期において内国法人から収受した受取配当等の額は次のとおりであり、\n    差引手取額を当期の収益に計上している。\n      銘柄等         区分       差引手取額    源泉徴収税額\n      D社株式        配当金      1,800,000      ――\n      E社株式        配当金      2,400,000      ――\n      F社株式        配当金        572,976     147,024\n      G証券投資信託  収益分配金    254,055      45,945\n      H証券投資信託  収益分配金    304,866      55,134\n      銀行預金       預金利子    1,219,464     220,536\n\n(2) 上記配当等の元本はすべて数年前より保有しており、その後異動はない。\n    なお、株式出資の持株割合は次のとおりである。\n      D社株式…100%　　E社株式…35%　　F社株式…10%\n(3) F社株式の名義は当社の役員であるが、実質的に保有しているのは当社である。\n(4) G証券投資信託は、その信託財産を主として国内株式に運用する証券投資信託に該当するもので、\n    特定株式投資信託には該当しない。\n(5) H証券投資信託は、特定株式投資信託に該当する。\n(6) 受取配当等の額から控除すべき負債利子の額は96,000である。","a":"〔受取配当等の益金不算入額〕\n D社（100%）  完全子法人株式等   1,800,000                → 1,800,000\n E社（35%）   関連法人株式等     2,400,000 − 96,000       → 2,304,000\n F社（10%）   その他の株式等     572,976+147,024=720,000\n                                 × 50%                    →   360,000\n G証券投資信託 対象外（特定株式投資信託に該当しない）      →         0\n H証券投資信託 非支配目的株式等とみなす（措法67の6）\n                                 304,866+55,134=360,000\n                                 × 20%                    →    72,000\n                                                   合計      4,536,000（減算・社外流出※）\n\n〔法人税額から控除される所得税額〕\n 147,024 + 45,945 + 55,134 + 220,536 = 468,639（加算・社外流出）\n ※元本はすべて数年前から保有し異動なしなので、所有期間按分は不要。\n\n◆ポイント\n ・判定手順：①特定株式投資信託か → NOなら対象外／②YESなら外国株価指数連動型か\n   → NOなら非支配目的株式等として20%。\n ・ETFは信託財産が株式のみなので「中身を見通して直接保有と同じに扱う」。\n   指数連動で分散しきっているから実質持株割合は5%以下 → 非支配目的 → 20%。\n ・Hについて持株割合は使わない。条文が「みなす」と決め打ちしている。\n ・F社は名義が役員でも実質所得者課税（法11）で当社の配当。源泉税を足し戻して720,000。\n ・源泉徴収がないD社・E社は、3分の1超保有なので源泉徴収不要の扱いと整合する。"},{"title":"寄附金　確認テスト第二問5・6（弱点分野）","q":"(1) 当期において損金経理により寄附金勘定に計上した金額の内訳\n      寄附先           使途等            金額        備考\n      日本赤十字社     災害救護物資の備蓄   600,000   日本赤十字社が財務大臣の承認を受け募集したもの\n      日本赤十字社     経常経費            300,000   ――\n      県立○○高校P.T.A 体育館の新築資金  1,000,000   建設された体育館は県立○○高校に帰属する\n      △△町内会       会費               120,000   ――\n      △△町内会       祭り費用           100,000   ――\n      □□神社         社殿建設資金      2,400,000   建設された社殿は□□神社に帰属する\n      合計                              4,520,000\n\n(2) 上記の他、当期において不要となった土地（帳簿価額23,000,000、時価25,000,000）を\n    千葉県に対して15,000,000で譲渡した。この譲渡に関して当社は以下の仕訳を行っている。\n      （現金）15,000,000　（土地）23,000,000\n      （譲渡損）8,000,000\n\n(3) 当期において損金経理により雑費勘定、支援金勘定等に計上した金額に次のものが含まれている。\n    ① 私立I大学に対して寄附をした費用の額  230,000\n       （当社社長の息子の大学入学に際し支出したものであり、社長個人が負担すべきものと認められる。）\n    ② 独立行政法人日本学生支援機構に対して支出した費用の額  3,400,000\n       （この金額のうち、400,000は学生に対する学資の貸与に充てられる金額である。）\n    ③ 自動車安全運転センター（特定公益増進法人に該当する。）に対して支出した費用の額  500,000\n\n(4) 当期末の資本金の額は100,000,000、資本準備金の額は20,000,000である。事業年度は12か月。\n(5) 寄附金の計算に入る前の別表四の仮計は 165,204,813 である。","a":"〔区分〕\n 国等・指定（全額損金）\n   県立高校P.T.A（体育館は高校に帰属）        1,000,000\n   千葉県への低額譲渡                        10,000,000\n   日本赤十字社 災害救護物資（財務大臣承認）     600,000\n   日本学生支援機構のうち学資の貸与分            400,000\n                                      計    12,000,000\n 特定公益増進法人等\n   日本赤十字社 経常経費                        300,000\n   日本学生支援機構 その他                    3,000,000\n   自動車安全運転センター                       500,000\n                                      計     3,800,000\n 一般\n   町内会 祭り費用                              100,000\n   □□神社 社殿建設資金                      2,400,000\n                                      計     2,500,000\n 寄附金に該当しないもの\n   町内会 会費 120,000 → 損金算入（調整なし）\n   私立I大学 230,000 → 役員給与（加算・社外流出）\n 支出寄附金合計 18,300,000\n\n〔低額譲渡〕\n 寄附金の額 = 時価 25,000,000 − 対価 15,000,000 = 10,000,000（法37⑧）\n 税務上の仕訳 （現金）15,000,000 （土地）23,000,000\n               （寄附金）10,000,000 （譲渡益）2,000,000\n → 損益への影響は会社と同じ△8,000,000。別表四の加算・減算は不要。\n\n〔限度額〕\n 資本基準額 100,000,000 + 20,000,000 = 120,000,000\n 寄附金支出前所得 165,204,813 + 18,300,000 = 183,504,813\n 一般 (120,000,000×2.5/1000 + 183,504,813×2.5/100) × 1/4 = 1,221,905\n 特増 (120,000,000×3.75/1000 + 183,504,813×6.25/100) × 1/2 = 5,959,525 ≧ 3,800,000 ∴全額損金\n\n〔損金不算入額〕\n 18,300,000 − 12,000,000 − 3,800,000 − 1,221,905 = 1,278,095（加算・社外流出）\n\n◆ポイント\n ・同じ相手でも使途で区分が分かれる。日赤は災害＝指定／経常経費＝特増。\n   学生支援機構は学資の貸与＝指定／それ以外＝特増。\n ・町内会は「会費」と「祭り費用」をわざわざ分けて書いてある＝扱いが違うという合図。\n ・低額譲渡は時価−対価。会社が計上した譲渡損8,000,000ではない。\n   8,000,000で計算すると限度額が12,500縮み、所得が12,500増える（寄附金だけ限度額が循環する）。\n ・一般は 2.5/2.5/1/4、特増は 3.75/6.25/1/2。数字が大きい方に割る数が小さい方が付く。\n ・資本基準は「資本金等の額」ではなく資本金＋資本準備金。"},{"title":"貸損－1　貸倒損失の基本問題","q":"次の資料に基づき、当社の当期における税務調整すべき金額を計算しなさい。\n\n(1) 当社は、得意先であるA社に対し貸付金5,000,000円を有しているが、同社の資産状況・\n    支払能力等からみて、その全額が回収できないことが明らかとなったため、その全額を\n    貸倒損失として損金経理している。\n\n(2) 得意先のB社について前期において、会社更生法の規定による更生計画の認可決定が\n    あったことによりB社に対する売掛金3,000,000円が切捨てられることとなったが、これに\n    ついて当社は何も処理していなかった。そこで、当期においてその全額3,000,000円を\n    貸倒損失として損金経理している。\n    なお、前期の確定申告において『貸倒損失認定損3,000,000円（減・留）』の税務調整が\n    されている。\n\n(3) 当社は、売掛金1,000,000円及び貸付金500,000円を有している得意先のC社が数年来\n    経営状態が悪化していたため前期の3月10日より取引を停止している。そのため、当期末に\n    おいてそれぞれ備忘価額1円を控除した残額を貸倒損失として損金経理している。\n\n(4) 当社は、前期にD社に対して資産の譲渡（未収の譲渡代金10,000,000円）を行ったが、\n    当期末において代金が未回収のまま1年以上経過したため、備忘価額1円を控除した残額を\n    貸倒損失として損金経理している。\n    なお、当社はこの取引以外にD社と取引を行った事実はない。\n\n(5) 当社は、E社に対して前渡金500,000円及び貸付金800,000円を有しているが、E社について\n    当期の11月19日に会社更生法の規定による更生計画の認可決定があり、全額切捨てられる\n    こととなった。これについて当社は何ら経理していない。\n\n(6) 当社は、F社に対して売掛金110,000円を有しているため、その支払いを再三督促したが、\n    いまだその弁済がないため備忘価額1円を控除した109,999円を貸倒損失として損金経理した。\n    なお、その取立費用の合計額は150,000円である。","a":"〔貸倒損失〕\n A社  ∴調整なし\n C社  500,000 − 1 = 499,999\n D社  10,000,000 − 1 = 9,999,999\n E社  500,000 + 800,000 = 1,300,000\n F社  売掛金110,000 ＜ 取立費用150,000  ∴調整なし\n\n〔別表四〕\n 前期貸倒損失否認（B社）  3,000,000（加算・留保）\n 貸倒損失否認（C社）        499,999（加算・留保）\n 貸倒損失否認（D社）      9,999,999（加算・留保）\n 貸倒損失認定損（E社）    1,300,000（減算・留保）\n\n◆各社の理由\n A社 全額回収不能が明らか＋損金経理 → 基通9-6-2（事実上）。貸付金でもOK、備忘価額不要。\n     正しい処理なので調整なし。\n B社 更生計画の認可決定は前期 → 貸倒れも前期。前期に認定損（減・留）で落ちている。\n     当期の損金経理は二重計上なので否認。前期の△3,000,000が洗い替えで消える。\n C社 取引停止後1年経過＝基通9-6-3（形式上）。ただし対象は売掛債権のみ。\n     売掛金999,999は認められる（調整なし）が、貸付金499,999は否認。\n D社 1年経過しているが「この取引以外に取引を行った事実はない」＝継続的取引でない。\n     基通9-6-3(1)(注)により適用なし → 全額否認。\n E社 更生計画の認可決定は当期 → 基通9-6-1（法律上）。損金経理は不要で当然に損金。\n     会社が何ら経理していないので認定損で減算。前渡金も貸付金も対象。\n F社 同一地域の売掛債権110,000 ＜ 取立費用150,000 ＋督促済み → 基通9-6-3(2)。\n     備忘価額1円を残しているので正しい。調整なし。\n\n◆ポイント\n ・①法律上 → ②事実上 → ③形式上 の順に当てる。③まで来て初めて「売掛債権か」を聞く。\n ・「会社が何もしていない」ときに減算できるのは9-6-1だけ。\n ・正解だから別表四に出てこない項目（A社・C社の売掛金・F社）がある。"},{"title":"買換－3　先行取得と特別償却","q":"次の資料に基づき、当社の当期における税務調整すべき金額を計算しなさい。\n\n(1) 譲渡資産に関する資料\n  ① 当期の2月13日に既成市街地等内に所在するA土地200㎡（平成7年1月6日に取得）を\n     800,000,000円（時価相当額）で他社に譲渡し、当社は譲渡直前の帳簿価額450,000,000円\n     及び譲渡経費4,800,000円を控除した残額を当期の収益に計上している。\n  ② 上記①のA土地の譲渡については、その契約において当該A土地の上に存する工場用建物を\n     取壊して引渡すこととなっていたため、当社は当該工場用建物を取壊し、その取壊し直前の\n     帳簿価額及び取壊し費用の合計額25,200,000円を当期の費用に計上している。\n\n(2) 買換資産に関する資料\n  ① 当社は前期の5月27日に既成市街地等内に所在するB土地1,200㎡（平成21年12月19日に取得）\n     の上に建物（取得価額640,000,000円、法定耐用年数50年）を建設し、前期の1月13日より\n     事業の用に供している。\n  ② 当社は前期の10月13日に既成市街地等内に所在する工場内で使用する中古の機械装置C\n     （取得価額100,000,000円、見積耐用年数10年）及び新品の機械装置D（取得価額80,000,000円、\n     法定耐用年数7年）を取得し、共に前期の10月25日より事業の用に供している。\n\n(3) 当社がA土地を譲渡資産、上記(2)の建物、機械装置C及び機械装置Dを買換資産として\n    租税特別措置法第65条の7第1項第2号（繰延割合は80%とする）の規定の適用を受けるため、\n    当期の確定した決算において圧縮積立金として積み立てる方法により経理した金額は\n    276,000,000円である。なお、翌期以降に買換資産を取得する見込みはない。\n    また、機械装置Dは租税特別措置法第42条の6第1項に規定する特定機械装置等に該当するため、\n    前期において特別償却の規定の適用を受けている。\n\n(4) 減価償却に関する資料\n    種類等    期末帳簿価額   当期償却費    圧縮積立金    備考\n    建　　物  637,696,000   10,000,000  240,000,000   ―\n    機械装置C  94,300,000    8,000,000   20,000,000   繰越償却超過額 700,000がある\n    機械装置D  49,480,000   20,000,000   16,000,000   繰越償却超過額 800,000がある\n    定額法を選定し届出をしている。平成19年4月1日以後取得の定額法償却率は、\n    耐用年数10年…0.100、耐用年数50年…0.020、耐用年数7年…0.143である。\n\n(5) 当社の期末資本金額は100,000,000円（株主はすべて個人）である。","a":"〔買換え〕\n(1) 経費  譲渡経費 4,800,000 + 工場用建物直前帳簿価額等 25,200,000 = 30,000,000\n(2) 差益割合  {800,000,000 − (450,000,000 + 30,000,000)} / 800,000,000 = 0.4\n(3) 圧縮基礎取得価額\n ① 建　　物  800,000,000 ＞ 640,000,000  ∴640,000,000\n ② 機械装置C  800,000,000 − 640,000,000 = 160,000,000 ＞ 100,000,000  ∴100,000,000\n(4) 圧縮限度額\n ① 建　　物  (イ) 640,000,000 × 0.4 × 80% = 204,800,000\n              (ロ) 204,800,000 × 637,696,000/640,000,000 = 204,062,720\n ② 機械装置C  (イ) 100,000,000 × 0.4 × 80% = 32,000,000\n              (ロ) 32,000,000 × (94,300,000 + 700,000)/100,000,000 = 30,400,000\n ③ 機械装置D  0\n(5) 圧縮超過額\n ① 建　　物  240,000,000 − 204,062,720 = 35,937,280\n ② 機械装置C  20,000,000 − 30,400,000 = △10,400,000（切捨）\n ③ 機械装置D  16,000,000 − 0 = 16,000,000\n\n〔減価償却〕\n(1) 建物\n ① 償却限度額 (640,000,000 − 204,062,720 × 640,000,000/637,696,000) × 0.020 = 8,704,000\n ② 償却超過額 10,000,000 − 8,704,000 = 1,296,000\n(2) 機械装置C\n ① 償却限度額 (100,000,000 − 20,000,000 × 100,000,000/(94,300,000+700,000)) × 0.100 = 7,894,736\n ② 償却超過額 8,000,000 − 7,894,736 = 105,264\n(3) 機械装置D\n ① 償却限度額 80,000,000 × 0.143 = 11,440,000\n ② 償却超過額 20,000,000 − 11,440,000 = 8,560,000\n\n〔別表四〕\n 圧縮積立金認定損            276,000,000（減算・留保）\n 建物圧縮積立金超過額         35,937,280（加算・留保）\n 機械装置D圧縮積立金超過額    16,000,000（加算・留保）\n 建物減価償却超過額            1,296,000（加算・留保）\n 機械装置C減価償却超過額         105,264（加算・留保）\n 機械装置D減価償却超過額       8,560,000（加算・留保）\n\n◆ポイント\n ・機械装置Dは特別償却を受けているので買換えの圧縮記帳は不可。圧縮限度額は0、\n   圧縮積立金16,000,000は全額超過。償却限度額も取得価額そのままに償却率を掛ける。\n ・圧縮基礎取得価額は減価させない。減価させるのは圧縮限度額の(ロ)だけ。\n ・繰越償却超過額は(ロ)の分子に足して税務上の簿価にする。\n ・償却限度額では取得時点に割り戻す。超過しているなら割り戻すと(イ)に戻る（建物）。\n   不足なら会社計上額を割り戻す（機械装置C）。"},{"title":"買換－4　特別勘定設定後の圧縮記帳","q":"次の資料に基づき、当社の当期における税務調整すべき金額を計算しなさい。\n\n(1) 土地の譲渡に関する事項\n  ① 前期の11月12日に当社が所有していた国内の甲土地（平成4年6月に取得）を\n     400,000,000円（時価相当額）で譲渡し、譲渡直前の帳簿価額91,800,000円との差額を\n     土地譲渡益として前期の収益に計上している。なお、面積は500㎡である。\n  ② 上記①の甲土地の譲渡契約において、甲土地の上に存していた倉庫用建物（取壊し直前の\n     帳簿価額11,000,000円であり、このほか繰越償却超過額1,200,000円がある。）を取壊して\n     更地にして引渡すこととしていたため、当社は当該取壊し直前の帳簿価額及び取壊し費用\n     4,000,000円の合計額を建物除却損として前期の費用に計上している。\n  ③ 当社は、上記①の甲土地の譲渡対価をもって下記(2)の国内にある建物を取得する見込みで\n     あったため、前期末において損金経理により特別勘定として233,600,000円を繰り入れた。\n\n(2) 減価償却に関する事項\n  ① 当期における減価償却資産の償却状況等は次のとおりであり、下記以外の資産については\n     適正な処理が行われている。\n       種類   取得価額(圧縮前)   当期償却費(損金経理)   事業供用日    耐用年数\n       建物     300,000,000          2,400,000        R9.6.10       50年\n  ② 減価償却の方法として定額法を選定し届出ており、耐用年数50年の場合の定額法の\n     償却率は0.020である。\n  ③ 当社は、上記(1)の甲土地を譲渡資産、上記建物を買換資産として租税特別措置法\n     第65条の8第7項（繰延割合は80%とする）の規定の適用を受けるため、当期において\n     減価償却費のほかに次のような経理を行ったのみである。\n     なお、翌期以降において買換資産をさらに取得する見込みはない。\n       （建物圧縮損）200,000,000　（建　物）200,000,000","a":"〔買換え〕\n(1) 経費  11,000,000 + 1,200,000 + 4,000,000 = 16,200,000\n          ↑倉庫用建物の直前帳簿価額 ↑繰越償却超過額 ↑取壊し費用\n(2) 差益割合  {400,000,000 − (91,800,000 + 16,200,000)} / 400,000,000 = 0.73\n(3) 圧縮基礎取得価額  400,000,000 ＞ 300,000,000  ∴300,000,000\n(4) 圧縮限度額\n ① 233,600,000                              ← 特別勘定の金額\n ② 300,000,000 × 0.73 × 80% = 175,200,000   ← 通常の計算\n ③ ①＞②  ∴175,200,000\n(5) 圧縮超過額  200,000,000 − 175,200,000 = 24,800,000\n\n〔減価償却〕\n(1) 償却限度額 (300,000,000 − 175,200,000) × 0.020 × 10/12 = 2,080,000\n(2) 償却超過額 (2,400,000 + 24,800,000) − 2,080,000 = 25,120,000\n\n〔特別勘定〕\n(1) 税務上戻入額 233,600,000\n(2) 会社上戻入額 0\n(3) (1) − (2) = 233,600,000\n   〈内訳〉取得指定期間内に買換資産を取得し圧縮記帳した金額 175,200,000\n           取得指定期間を経過する日における特別勘定残高    58,400,000\n\n〔別表四〕\n 圧縮特別勘定戻入不足額  233,600,000（加算・留保）\n 建物減価償却超過額       25,120,000（加算・留保）\n\n◆ポイント\n ・圧縮限度額には上限が2つある。特別勘定の金額(①)と通常計算(②)の少ない方。\n   先に損金にした金額を超えて圧縮することはできない。\n ・戻入れは益金算入。前期に損金にしたものを返すから。会社が戻していないので戻入不足額を加算。\n ・戻す理由は2つ（圧縮記帳した分＋取得見込みがなくなった分）だが、扱いはどちらも益金。\n ・取壊して引き渡す建物の税務上の簿価（簿価＋繰越償却超過額）が経費に入る。\n ・直接減額方式なので圧縮超過額24,800,000が償却費に合流する。\n ・月数は事業供用日（6/10）から10か月。"},{"title":"貸引－5　貸倒引当金の総合問題Ⅱ","q":"次の資料に基づき、当社の当期における税務調整すべき金額を計算しなさい。\n\n(1) 当社の当期における貸借対照表に計上されている債権等の額（貸倒引当金控除前の金額）は\n    次のとおりである。\n      売　掛　金  79,000,000円    受 取 手 形  50,300,000円\n      貸　付　金  32,200,000円    前　渡　金   2,000,000円\n      差入営業保証金  3,500,000円\n\n(2) 上記の債権等の額のうちにはA社に対する受取手形300,000円が含まれているが、前々期に\n    おいてA社につき民事再生法の規定による再生手続開始の申立てが行われている。\n    なお、当期においても再生計画の認可決定は行われていない。\n\n(3) 上記の債権等の額のうちにはB社に対する受取手形400,000円が含まれているが、当社は\n    B社に対して買掛金1,000,000円を有している。\n\n(4) 上記の債権等の額のうちにはC社に対する貸付金700,000円が含まれているが、前期において\n    C社につき会社更生法の規定による更生手続開始の申立てが行われている。なお、この貸付金\n    にはC社の社長により350,000円の保証がされている。また、当期においても更生計画の認可\n    決定は行われていない。\n\n(5) 上記の債権等の額のうちにはD社に対する売掛金1,800,000円が含まれているが、当期において\n    同社に係る債権者集会が開かれ次の協議決定（合理的な基準により、債務者の負債整理を\n    定めている。）がなされた。\n      ① 債権金額のうち20%を切捨てる。\n      ② 切捨後の債権金額のうち30%は翌期首から5年以内に分割返済され、70%は5年経過後に\n         弁済される。\n    なお、当社は上記切捨額について何も経理していない。\n\n(6) 上記の債権等の額のうちにはE社に対する売掛金3,000,000円及び貸付金1,000,000円が\n    あるが、当社はE社に対して買掛金1,000,000円及び支払手形600,000円を有している。\n    また、貸付金についてE社所有の有価証券（時価1,500,000円）が担保に供されている。\n\n(7) 過年度における一括評価金銭債権の額、個別貸倒引当金繰入額及び貸倒損失額の資料は\n    次のとおりであり、すべて税務上適正額である。\n      事業年度          R6.4.1〜R7.3.31  R7.4.1〜R8.3.31  R8.4.1〜R9.3.31\n      一括評価金銭債権     109,000,000      96,000,000      111,000,000\n      個別貸倒引当金繰入額       ――      (注)150,000      (注)500,000\n      貸倒損失額               648,100         690,000          780,000\n    (注) 上記(2)、(4)の資料により繰入れた金額である。\n\n(8) 過年度における実質的に債権とみられないものの額の資料は次のとおりである。\n      事業年度              一括評価金銭債権  原則法による額  実際に控除した額\n      H27.4.1〜H28.3.31        95,300,000      5,400,000      5,400,000\n      H28.4.1〜H29.3.31       107,000,000      5,100,000      4,800,000\n\n(9) 前期の貸借対照表に計上されている貸倒引当金勘定の金額には前期において税務計算上\n    否認された貸倒引当金の繰入超過額269,920円が含まれており、当社は当期において全額を\n    取崩して収益に計上している。また、当期末において損金経理により貸倒引当金勘定に\n    3,160,000円（内訳：A社分200,000円、C社分360,000円、D社分1,200,000円、\n    一括評価分1,400,000円）繰入れている。\n\n(10) 当社は製造業（主たる事業）及び卸売業を営む期末資本金1億円の内国法人である。\n     なお、株主は全て個人である。","a":"〔貸倒損失認定損〕\n 1,800,000 × 20% = 360,000\n\n〔貸倒引当金〕\n(1) 個別評価\n ① A社  繰入限度額 300,000 × 50% = 150,000\n         繰入超過額 200,000 − 150,000 = 50,000\n ② C社  繰入限度額 700,000 × 50% = 350,000\n         繰入超過額 360,000 − 350,000 = 10,000\n ③ D社  繰入限度額 (1,800,000 − 360,000) − (1,800,000 − 360,000) × 30% = 1,008,000\n         繰入超過額 1,200,000 − 1,008,000 = 192,000\n\n(2) 一括評価\n ① 実績基準額\n  (イ) 一括評価金銭債権の額\n     79,000,000 − 360,000 − (1,800,000 − 360,000)      ← 売掛金／切捨／D社\n     + 50,300,000 − 300,000                             ← 受取手形／A社\n     + 32,200,000 − 700,000  = 158,700,000              ← 貸付金／C社\n  (ロ) 158,700,000 × 0.0083 = 1,317,210\n     (注) (648,100 + 690,000 + 150,000 + 780,000 + 500,000 − 150,000) × 12/36\n          ÷ ((109,000,000 + 96,000,000 + 111,000,000) ÷ 3)\n        = 0.00828 → 0.0083（小数点以下4位未満切上）\n ② 法定基準額\n  (イ) 一括評価金銭債権の額  158,700,000\n  (ロ) 実質的に債権とみられないものの額\n    (a) 原則法  B社 400,000 ＜ 1,000,000  ∴400,000\n                E社 3,000,000 + 1,000,000 = 4,000,000\n                    ＞ 1,000,000 + 600,000 = 1,600,000  ∴1,600,000\n                計 2,000,000\n    (b) 簡便法  控除割合 (5,400,000 + 5,100,000) ÷ (95,300,000 + 107,000,000)\n                        = 0.0519… → 0.051（小数点以下3位未満切捨）\n                控除額  158,700,000 × 0.051 = 8,093,700\n    (c) (a) ＜ (b)  ∴2,000,000\n  (ハ) (158,700,000 − 2,000,000) × 8/1,000 = 1,253,600\n ③ 繰入限度額  1,317,210 ＞ 1,253,600  ∴1,317,210\n    繰入超過額  1,400,000 − 1,317,210 = 82,790\n\n〔別表四〕\n 貸倒損失認定損                      360,000（減算・留保）\n 貸倒引当金繰入超過額（A社）          50,000（加算・留保）\n 貸倒引当金繰入超過額（C社）          10,000（加算・留保）\n 貸倒引当金繰入超過額（D社）         192,000（加算・留保）\n 貸倒引当金繰入超過額（一括評価）     82,790（加算・留保）\n 貸倒引当金繰入超過額認容            269,920（減算・留保）\n\n◆ポイント\n ・A社・C社は申立てだけ（認可決定なし）→ 形式基準で50%。D社は協議決定 → 長期棚上げで50%なし。\n   1問の中に三号と一号が並んでいる。\n ・C社の社長保証350,000は控除しない。700,000×50%と同額になる作りなので気づきにくい。\n ・E社の有価証券1,500,000（担保）は控除しない。一括評価で担保は見ない。\n   控除するのは買掛金1,000,000＋支払手形600,000＝1,600,000（債務）。\n ・個別評価では支払手形を控除しないが、一括評価の原則法では控除する。扱いが逆。\n ・実績率の分子に個別評価の繰入150,000・500,000と取崩△150,000が入る（残高ではなくフロー）。\n ・簡便法は「原則法による額」で割合を作る。「実際に控除した額」は使わない。\n ・法定繰入率は主たる事業で判定。製造業なので8/1000（卸売業の10/1000ではない）。\n ・前渡金と差入営業保証金は一括評価にも実質的に債権とみられないものにも入らない。"},{"title":"外貨－1　資産負債の換算I","q":"当期末は令和10年3月31日である。下記の資料に基づき、外貨建資産負債に関し\n税務上調整すべき金額を計算しなさい。\n\n(1) 当期末における貸借対照表に計上されている資産及び負債には、次の外貨建のものが含まれている。\n\n  区分          資産負債の金額               回収、満期及び支払期限\n  外国通貨      30,000ドル （3,780,000円）   ―\n  外貨定期預金  20,000ドル （2,460,000円）   令和10年9月30日\n  外貨定期預金  15,000ユーロ（1,785,000円）  令和11年4月30日\n  貸 付 金      40,000ユーロ（4,600,000円）  令和10年8月31日\n  借 入 金      50,000ドル （6,350,000円）   令和12年3月31日\n\n(2) 上記(1)の円換算額はすべて当期に発生したものであり、計上日の電信売買相場の仲値により\n    換算したものである。\n(3) 上記の他、外貨建有価証券を当期の3月25日に80,000ドルで取得しているが、期末時の為替レートで\n    換算した9,920,000円を貸借対照表価額とし、取得時の為替レートとの差額80,000円は為替差損として\n    当期の費用に計上している。\n    なお、この外貨建有価証券は売買目的有価証券及び償還有価証券には該当しないものである。\n(4) 当社は外貨建資産負債の換算方法については、何ら選定の届出をしていない。\n(5) ドル及びユーロの為替レート（電信売買相場の仲値）\n    ドル　令和10年3月25日 125円／令和10年3月31日 124円\n    ユーロ　令和10年3月31日 117円","a":"〔外貨建資産等〕\n(1) 外国通貨  … 期末時換算法（強制）\n ① 税務上簿価 124 × 30,000ドル = 3,720,000\n ② 会社上簿価 3,780,000\n ③ 調整金額 ① − ② = △60,000\n(2) 外貨定期預金（ドル）満期R10.9.30 ≦ R11.3.31 … 短期 → 期末時換算法\n ① 124 × 20,000ドル = 2,480,000\n ② 2,460,000\n ③ ① − ② = 20,000\n(3) 外貨定期預金（ユーロ）満期R11.4.30 > R11.3.31 … 長期 → 発生時換算法\n ① 1,785,000\n ② 1,785,000\n ③ ① − ② = 0  ∴調整なし\n(4) 貸付金（ユーロ）回収R10.8.31 ≦ R11.3.31 … 短期 → 期末時換算法\n ① 117 × 40,000ユーロ = 4,680,000\n ② 4,600,000\n ③ ① − ② = 80,000\n(5) 借入金（ドル）支払期限R12.3.31 > R11.3.31 … 長期 → 発生時換算法\n ① 6,350,000\n ② 6,350,000\n ③ ① − ② = 0  ∴調整なし\n(6) 外貨建有価証券（売買目的外・償還以外）… 発生時換算法（強制・選択の余地なし）\n ① 125 × 80,000ドル = 10,000,000\n ② 9,920,000\n ③ ① − ② = 80,000\n\n〔別表四〕\n 為替差損益計上もれ（外　国　通　貨）    60,000（減算・留保）\n 為替差損益計上もれ（外貨定期預金）      20,000（加算・留保）\n 為替差損益計上もれ（貸　付　金）        80,000（加算・留保）\n 為替差損益計上もれ（外貨建有価証券）    80,000（加算・留保）\n\n◆ポイント\n ・資料の表は区分の行と日付の行がずれやすい。外国通貨の期限欄は「―」。まずここで行を合わせる。\n ・届出がない場合の法定換算方法（令122の5）：短期＝期末時換算法／長期＝発生時換算法。短期と長期で逆。\n ・短期の判定（令122の4）は「期末の翌日から1年を経過した日の前日まで」。期末R10.3.31ならR11.3.31まで。\n ・外国通貨は満期がない＝常に短期と同じなので、期末時換算法が強制。選択も届出も関係ない。\n ・有価証券は法61の9①二ハで発生時換算法のみ。問題文の「売買目的有価証券及び償還有価証券に\n   該当しない」はハに落とすための一文で、届出の話とは無関係。\n ・会社は為替差損80,000を計上済みだが、税務上は換算しないので0。差＋80,000は「益の計上もれ」＝\n   実質は会社の費用計上の否認。損を立てすぎたのと益を立て忘れたのは別表四では同じ加算になる。\n ・向きは常に「税務上簿価 − 会社上簿価」で出し、符号をそのまま別表四へ。損益から考えない。\n ・すべて資産負債の簿価のズレなので留保。別表五(1)で管理し、売却・満期で消える。"},{"title":"外貨－2　資産負債の換算II（為替予約）","q":"当期末は令和10年3月31日である。下記の資料に基づき、外貨建資産負債に関し\n税務上調整すべき金額を計算しなさい。\n\n(1) 当期末における外貨建資産負債の保有状況等\n\n  区分                  外貨建の金額   取得時レート   帳簿価額      当期末レート\n  資産 外貨定期預金       10,000Xドル      145円      1,450,000円\n  資産 X国子会社貸付金     50,000Xドル      144円      7,200,000円\n  資産 X国子会社長期貸付金 70,000Xドル      150円     11,060,000円      143円\n  資産 X国子会社売掛金     60,000Xドル      142円      8,940,000円\n  負債 X国親会社買掛金     40,000Xドル      140円      5,600,000円\n  負債 X国親会社借入金    100,000Xドル      153円     15,300,000円\n\n(2) 短期外貨建債権債務については期末時換算法を選定している。\n    短期外貨建債権債務以外の外貨建資産負債については、換算方法の選定の届出をしていない。\n(3) 「外貨定期預金」の預入期間は6ヶ月で、満期日は令和10年6月25日である。\n(4) 「X国子会社貸付金」は当期の10月1日に貸付けたものであり、翌期以降毎年10月1日に\n    10,000Xドルずつ返済される契約となっている。\n(5) 「X国子会社長期貸付金」は当期の12月1日に貸付けたもの（決済日は令和12年7月31日）であるが、\n    当期の11月10日に先物外国為替契約等を締結しており、予約レートは158円である。\n    契約締結日において円換算額を確定させた旨を帳簿書類に記載している。会社の処理は次のとおり。\n      （貸付金）11,060,000  ／（現金）10,500,000 ・（為替差損益）560,000\n(6) 「X国子会社売掛金」は当期の1月27日に掛売上を行ったことにより計上したものであるが、\n    当期の3月10日に先物外国為替契約等を締結（同日の為替レートは145円）し、予約レート149円を\n    もとに次の処理を行った。契約締結日において円換算額を確定させた旨を帳簿書類に記載している。\n      （売掛金）420,000  ／（為替差損益）420,000\n    なお、当該売掛金の決済日は令和10年6月30日である。\n(7) 「X国親会社買掛金」は翌期中に支払期限が到来するものである。\n(8) 「X国親会社借入金」は当期の12月1日に借入れたものであり、翌期以降毎年12月1日に\n    20,000Xドルずつ返済する契約となっている。","a":"〔外貨建資産等〕\n(1) 外貨定期預金（満期R10.6.25 … 短期）\n ① 143 × 10,000Xドル = 1,430,000\n ② 1,450,000\n ③ ① − ② = △20,000\n(2) X国子会社貸付金（毎年10/1に10,000ドルずつ返済 … 1年以内分だけ短期）\n ① 143 × 10,000Xドル + 144 × (50,000Xドル − 10,000Xドル) = 7,190,000\n ② 7,200,000\n ③ ① − ② = △10,000\n(3) X国子会社長期貸付金（予約先行 … 取引日R9.12.1〜決済日R12.7.31 = 32月、当期4月）\n ① 益金算入額 (158 − 150) × 70,000Xドル × 4月/32月 = 70,000\n ② 調整金額 560,000 − 70,000 = 490,000\n(4) X国子会社売掛金（取引先行 … 直々差額は当期一括、直先差額は予約日3/10〜決済6/30 = 4月、当期1月）\n ① 益金算入額\n  (イ) 直々差額 (145 − 142) × 60,000Xドル = 180,000\n  (ロ) 直先差額 (149 − 145) × 60,000Xドル × 1月/4月 = 60,000\n  (ハ) (イ) + (ロ) = 240,000\n ② 調整金額 420,000 − 240,000 = 180,000\n(5) X国親会社買掛金（翌期中に支払期限 … 短期）\n ① 143 × 40,000Xドル = 5,720,000\n ② 5,600,000\n ③ ① − ② = 120,000\n(6) X国親会社借入金（毎年12/1に20,000ドルずつ返済）\n ① 143 × 20,000Xドル + 153 × (100,000Xドル − 20,000Xドル) = 15,100,000\n ② 15,300,000\n ③ ① − ② = △200,000\n\n〔別表四〕\n 為替差損益計上もれ（外貨定期預金）            20,000（減算・留保）\n 為替差損益計上もれ（貸　付　金）              10,000（減算・留保）\n 前受収益計上もれ（X国子会社長期貸付金）      490,000（減算・留保）\n 前受収益計上もれ（X国子会社売掛金）          180,000（減算・留保）\n 為替差損益計上もれ（買　掛　金）             120,000（減算・留保）\n 為替差損益計上もれ（借　入　金）             200,000（加算・留保）\n\n◆ポイント\n ・資産と負債で符号が逆。買掛金は税務＞会社の＋120,000でも「負債が増える＝損」なので減算。\n ・分割返済は1年以内に期日が来る分だけ短期。1本の債権を2つに割って換算する。\n ・為替予約で期間按分するのは直先差額だけ。直々差額は当期に全額計上する。\n ・按分の終点はどちらも決済日。起点は、予約先行なら取引日、取引先行なら予約日。\n ・繰延分の科目は「前受収益計上もれ」。為替差損益ではない。\n ・長期貸付金は予約が貸付より先（11/10＜12/1）なので直々差額が生じない。ここで(イ)(ロ)に\n   分けてしまうと間違える。"},{"title":"外貨－3　貸倒引当金との関係","q":"当社は、期末資本金1億円の製造業を営む非同族会社（株主はすべて個人）である。\n当期末は令和10年3月31日である。下記の資料に基づき、当社の当期の税務上調整すべき金額を\n計算しなさい。\n\n(1) 当期末における貸借対照表に計上されている債権の額（貸倒引当金控除前）\n  ① 売掛金 210,000,000円   ② 受取手形 130,000,000円\n  ③ 貸付金  50,000,000円   ④ 未収金    30,000,000円\n  ⑤ 前渡金   5,000,000円\n (注1) 売掛金のうち28,600,000円（200,000Yドル）は当社のY国子会社A社に対するものである。\n       また、買掛金のうちY国子会社A社に対するものは14,200,000円（100,000Yドル）である。\n       なお、売掛金及び買掛金の決済日はすべて翌期中に到来するものである。\n (注2) 貸付金のうち42,000,000円（300,000Yドル）は当期の12月10日にY国に所在するB社に\n       貸付けたものであり、翌期以降毎年12月10日を返済期日として60,000Yドルずつ返済される\n       契約となっている。\n (注3) 未収金のうち2,000,000円は仕入割戻しの未収分であり、残額は機械の譲渡代金に係るもので\n       ある（A社に対するものではない。）。\n (注4) 前渡金はすべて原材料の仕入に充てられるものである。\n(2) 実質的に債権とみられないものの額の計算上必要な基準年度実績による控除割合は0.0349である。\n(3) 当社の過年度における貸倒実績等（税務上適正額）\n                      R6.4.1開始     R7.4.1開始     R8.4.1開始\n  貸倒損失額            2,300,000円    3,000,000円    3,450,000円\n  期末一括評価金銭債権 380,435,000円  393,210,000円  400,355,000円\n(4) 前期において損金経理により貸倒引当金勘定に繰入れた金額3,153,944円（うち繰入超過額60,000円）\n    を全額取崩し当期の収益に計上し、当期末に3,801,605円を損金経理により貸倒引当金勘定に繰入れた。\n(5) 外貨建資産等の換算方法について何ら選定の届出をしていない。当期末の為替レートは\n    1Yドル当たり144円であり、当期の12月10日の為替レートは1Yドル当たり140円である。","a":"〔外貨建資産等〕\n(1) A社売掛金（決済日は翌期中 … 短期）\n ① 144 × 200,000Yドル = 28,800,000\n ② 28,600,000\n ③ ① − ② = 200,000\n(2) A社買掛金（決済日は翌期中 … 短期）\n ① 144 × 100,000Yドル = 14,400,000\n ② 14,200,000\n ③ ① − ② = 200,000\n(3) B社貸付金（毎年12/10に60,000ドルずつ返済 … 1年以内分だけ短期）\n ① 144 × 60,000Yドル + 140 × (300,000Yドル − 60,000Yドル) = 42,240,000\n ② 42,000,000\n ③ ① − ② = 240,000\n\n〔貸倒引当金〕\n(1) 繰入限度額\n ① 実績基準額\n  (イ) 一括評価金銭債権の額\n     (210,000,000 + 200,000) + 130,000,000 + (50,000,000 + 240,000)\n     + (30,000,000 − 2,000,000) = 418,440,000\n  (ロ) 418,440,000 × 0.0075 = 3,138,300\n  (注) 貸倒実績率\n     (2,300,000 + 3,000,000 + 3,450,000) × 12/36\n     ÷ {(380,435,000 + 393,210,000 + 400,355,000) ÷ 3}\n     = 0.00745… → 0.0075（小数点以下4位未満切上）\n ② 法定基準額\n  (イ) 一括評価金銭債権の額 418,440,000\n  (ロ) 実質的に債権とみられないものの額\n     ㋑ 原則法（Y国子会社A社） 28,800,000 ＞ 14,400,000 ∴14,400,000\n     ㋺ 簡便法 (a) 控除割合 0.0349 → 0.034（小数点以下3位未満切捨）\n              (b) 418,440,000 × 0.034 = 14,226,960\n     ㋩ ㋑ ＞ ㋺ ∴14,226,960\n  (ハ) (418,440,000 − 14,226,960) × 8/1,000 = 3,233,704\n ③ ① ＜ ② ∴3,233,704\n(2) 繰入超過額 3,801,605 − 3,233,704 = 567,901\n\n〔別表四〕\n 為替差損益計上もれ（売掛金）     200,000（加算・留保）\n 為替差損益計上もれ（買掛金）     200,000（減算・留保）\n 為替差損益計上もれ（貸付金）     240,000（加算・留保）\n 貸倒引当金繰入超過額認容          60,000（減算・留保）\n 貸倒引当金繰入超過額             567,901（加算・留保）\n\n◆ポイント\n ・先に外貨の換算調整を終わらせてから貸引に入る。一括評価金銭債権には調整後の額を入れる。\n ・売掛金＋200,000、貸付金＋240,000を足し込む。順番を逆にすると必ず間違える。\n ・買掛金は負債なので＋200,000でも減算。資産と負債で符号が逆。\n ・B社貸付金は毎年60,000ドルずつ返済なので、1年以内分60,000ドルだけ期末レート144円。\n ・仕入割戻しの未収分2,000,000は売掛債権等に該当しない（基通11-2-18(8)）。\n ・前渡金5,000,000は一括評価にも実質的に債権とみられないものにも入らない。\n ・控除割合は3位未満切捨（0.0349→0.034）、貸倒実績率は4位未満切上（0.00745…→0.0075）。\n   1問の中に逆向きで出る。どちらも引当てが多くなる側。\n ・原則法と簡便法は小さい方を採用（14,400,000 ＞ 14,226,960 ∴14,226,960）。\n ・法定繰入率は製造業なので8/1,000。期末資本金1億円・非同族なので措法57の9を使える。"},{"title":"借地－1　借地権の基本（設定と更新）","q":"＜設問1＞\n次の資料に基づき、当社の当期において税務調整すべき金額を計算しなさい。\n(1) 当社は、既成市街地等内に所有している土地（平成19年1月21日に取得）であり、\n    借地権設定直前の帳簿価額60,000,000円、時価100,000,000円のものを他社に対し\n    建物の建設用地として当期の6月3日に賃貸することとした。\n    該借地権の時価は70,000,000円であり、賃貸後の土地の時価は30,000,000円である。\n(2) 当社は権利金として70,000,000円（税務上適正額）及び当期分の地代（税務上適正額）を\n    収受し、当期の収益に計上している。\n\n＜設問2＞\n次の資料に基づき、当社の当期における税務上調整すべき金額を計算しなさい。\n(1) 当社は以前より賃借していた土地の契約期間が満了となったため、当期において契約の更新を行い、\n    地主に対し更新料6,000,000円を支払い、借地権勘定に資産計上した。\n(2) この借地権の更新直前の帳簿価額は12,000,000円であり、当社はこの更新に際し\n    その帳簿価額相当額を費用に計上している。\n    なお、更新時の借地権の価額は40,000,000円である。","a":"＜設問1＞\n〔土地帳簿価額認定損〕\n(1) 判定\n    (100,000,000 − 30,000,000) ÷ 100,000,000 = 70% ≧ 5/10  ∴著しい下落あり\n(2) 損金算入額\n    60,000,000 × 70,000,000/100,000,000 = 42,000,000\n\n  土地帳簿価額認定損        42,000,000（別表四　減算・留保）\n\n＜設問2＞\n〔借地権〕\n(1) 損金算入額\n    12,000,000 × 6,000,000/40,000,000 = 1,800,000\n(2) 税務上簿価\n    12,000,000 − 1,800,000 + 6,000,000 = 16,200,000\n(3) 会社上簿価\n    12,000,000 − 12,000,000 + 6,000,000 = 6,000,000\n(4) 調整金額\n    (2) − (3) = 10,200,000\n\n  借地権計上もれ            10,200,000（別表四　加算・留保）\n\n◆ポイント\n ・令138①は判定と算式で分子が違う。判定＝土地の価額の下落額、算式＝借地権の価額。\n   この問題はどちらも70,000,000で一致するが、ズレる資料なら算式には借地権の価額を使う。\n ・分母はどちらも「設定直前」の土地の価額。賃貸後の30,000,000を分母にしない。\n ・権利金・地代はいずれも税務上適正額なので、収益計上はそのままでよい。調整は土地の簿価だけ。\n ・令139の更新料は「借地権の帳簿価額に加算する」＝資産計上。費用ではない。\n ・落とせるのは旧簿価 × 更新料/更新時の借地権の価額。ここでは15%＝1,800,000だけ。\n   会社は旧簿価を全額費用にしたので、動いていない85%＝10,200,000が計上もれになる。\n ・15%部分は簿価1,800,000が更新料6,000,000に置き換わる。含み益4,200,000はここでは\n   実現せず、借地権の中に温存される。当期の所得への影響は損金1,800,000だけ。\n ・令138は貸す側（土地の簿価を落とす）、令139は借りる側（借地権の簿価を落とす）。\n   どちらも「その資産の時価の全体」を分母に、「そのうち動いた部分」を分子にする。"}],"kaisei":[{"title":"グループ法人税制（完全支配関係）","art":"平成22年度改正","pillars":[{"l":"対象","seg":[{"b":"100%"},{"t":"の持株関係（完全支配関係）にある法人グループ。"},{"b":"強制"},{"t":"適用（選択ではない）。"}]},{"l":"譲渡損益の繰延べ","seg":[{"t":"完全支配関係がある法人間で"},{"b":"譲渡損益調整資産"},{"t":"（固定資産・土地・有価証券・金銭債権・繰延資産で帳簿価額"},{"b":"1,000万円"},{"t":"以上）を譲渡した場合、譲渡損益を"},{"b":"繰り延べる"},{"t":"。"}]},{"l":"寄附金・受贈益","seg":[{"t":"完全支配関係（法人による完全支配関係に限る）がある法人間では、支出側は"},{"b":"全額損金不算入"},{"t":"、受領側は"},{"b":"全額益金不算入"},{"t":"。"}]},{"l":"配当","seg":[{"t":"完全子法人株式等に係る配当等は"},{"b":"全額"},{"t":"益金不算入（負債利子控除"},{"b":"なし"},{"t":"）。"}]}]},{"title":"グループ通算制度","art":"令和4年4月1日以後開始事業年度","pillars":[{"l":"位置づけ","seg":[{"b":"連結納税制度"},{"t":"に代わる制度として導入。適用は"},{"b":"選択"},{"t":"制（国税庁長官の承認）。"}]},{"l":"申告","seg":[{"t":"連結納税と異なり、各法人が"},{"b":"個別"},{"t":"に法人税の申告・納付を行う（個別申告方式）。"}]},{"l":"損益通算","seg":[{"t":"通算グループ内の欠損法人の欠損金額を、所得法人の所得金額の比で"},{"b":"配分"},{"t":"して損金算入する（プロラタ方式）。"}]},{"l":"修更正の遮断","seg":[{"t":"一法人に修正・更正があっても、原則として他の通算法人の税額計算に"},{"b":"影響させない"},{"t":"（遮断措置）。"}]}]},{"title":"収益認識に関する規定の法人税法への取込み","art":"平成30年度改正・法22の2","pillars":[{"l":"背景","seg":[{"t":"企業会計の"},{"b":"収益認識に関する会計基準"},{"t":"の導入に対応し、法人税法上の収益の計上時期・計上額を"},{"b":"条文"},{"t":"で明確化した。"}]},{"l":"計上額","seg":[{"t":"貸倒れの可能性・"},{"b":"買戻し"},{"t":"の可能性は考慮しない（＝これらを織り込んだ会計上の収益減額は税務上"},{"b":"認められない"},{"t":"）。"}]},{"l":"値引き・返品","seg":[{"t":"変動対価のうち値引き・返品の見込みは、客観的な基準に基づくものであれば"},{"b":"反映できる"},{"t":"。"}]}]},{"title":"賃上げ促進税制","art":"措法42の12の5","pillars":[{"l":"概要","seg":[{"t":"雇用者"},{"b":"給与等支給額"},{"t":"を前年度から一定割合以上増加させた場合に、増加額の一定割合を法人税額から"},{"b":"税額控除"},{"t":"できる。"}]},{"l":"上限","seg":[{"t":"控除税額は当期の法人税額の"},{"b":"20%"},{"t":"が上限。"}]},{"l":"中小企業向けの繰越","seg":[{"t":"令和6年度改正により、控除しきれなかった額を"},{"b":"5年"},{"t":"間繰り越せることとされた（中小企業者等）。"}]},{"l":"注意","seg":[{"t":"毎年のように"},{"b":"改正"},{"t":"される。年度版教材で必ず最新の要件・率を確認すること。"}]}]},{"title":"少額減価償却資産の貸付け用除外","art":"令和4年度改正","pillars":[{"l":"内容","seg":[{"t":"取得価額10万円未満の少額減価償却資産、一括償却資産、中小企業者等の30万円未満の特例のいずれも、"},{"b":"貸付け"},{"t":"（主要な事業として行われるものを除く）の用に供した資産は"},{"b":"対象外"},{"t":"とされた。"}]},{"l":"趣旨","seg":[{"t":"節税を目的とした"},{"b":"ドローン・足場"},{"t":"等のレンタルスキームへの対応。"}]}]},{"title":"交際費等から除外される飲食費の基準額","art":"令和6年度改正","pillars":[{"l":"改正内容","seg":[{"t":"1人当たりの飲食費の基準額が"},{"b":"5,000円"},{"t":"以下から"},{"b":"1万円"},{"t":"以下に引き上げられた（令和6年4月1日以後に支出するもの）。"}]},{"l":"除外の条件","seg":[{"b":"社内飲食費"},{"t":"（役員・従業員のみの飲食）は除外の対象と"},{"b":"ならない"},{"t":"。所定の事項を記載した書類の保存が要件。"}]}]}]};
var START=Date.UTC(2026,7,31)/86400000, EXAM=Date.UTC(2027,7,4)/86400000;
var PER_WEEK=2, N_REVIEW=4, N_BT4=6, N_KEISAN=2, N_KAISEI=1, N_ENSHU=1;
var showAll=false, tab='theory';

function ordToday(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
var ORD=ordToday();
var WEEK=Math.floor((ORD-START)/7)+1; if(WEEK<1)WEEK=0;
var UNLOCKED=WEEK?Math.min(WEEK*PER_WEEK,DATA.theory.length):0;

function win(a,off,n){if(!a.length)return[];var r=[],L=a.length;
  for(var i=0;i<Math.min(n,L);i++)r.push(a[((off+i)%L+L)%L]);return r;}
function mod(n,L){return L?((n%L)+L)%L:0;}

function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function segHTML(sg){return sg.map(function(s){
  return s.b!==undefined?'<span class="b">'+esc(s.b)+'</span>':esc(s.t);}).join('');}
function pillarsHTML(ps){return ps.map(function(p){
  return '<div class="p"><span class="l">'+esc(p.l)+'</span><span class="x">'+segHTML(p.seg)+'</span></div>';}).join('');}
function enshuCard(o){
  return '<div class="card enshu"><h2>'+esc(o.title)+'</h2>'
    +'<div class="q">'+esc(o.q)+'</div>'
    +'<button class="reveal">解答を見る</button>'
    +'<div class="a" hidden>'+esc(o.a)+'</div></div>';}
function card(o,cls,tag){
  return '<div class="card'+(cls?' '+cls:'')+'">'+(tag||'')+'<h2>'+esc(o.title)+'</h2>'
    +(o.art?'<div class="art">'+esc(o.art)+'</div>':'')
    +(o.pillars?pillarsHTML(o.pillars):'<div class="p"><span class="x">'+segHTML(o.seg)+'</span></div>')+'</div>';}

function render(){
  var h='', d=DATA;
  if(tab==='theory'){
    if(showAll){ h=d.theory.map(function(o){return card(o);}).join(''); }
    else if(!WEEK){
      h='<div class="note">開講前の助走期間です。理論は '+new Date(START*86400000).toLocaleDateString('ja-JP')
        +' から週'+PER_WEEK+'題ずつ解禁されます。それまでは「別表四」「改正・新論点」タブが使えます。</div>';
    } else {
      var nw=d.theory.slice((WEEK-1)*PER_WEEK,UNLOCKED);
      var older=d.theory.slice(0,Math.max(0,(WEEK-1)*PER_WEEK));
      var rv=win(older,mod(ORD,older.length),N_REVIEW);
      h=nw.length?('<div class="sec">今週の新規（毎日やる）</div>'
        +nw.map(function(o){return card(o,'new','<span class="tag n">NEW</span>');}).join(''))
        :'<div class="note">収録済みの理論をすべて解禁しました。content.py に題を追加すると、この先の週に自動で割り当てられます。</div>';
      if(rv.length) h+='<div class="sec">復習（既習分から巡回）</div>'
        +rv.map(function(o){return card(o,'','<span class="tag r">復習</span>');}).join('');
    }
  } else if(tab==='enshu'){
    var ea=d.enshu;
    h=(showAll?ea:win(ea,mod(ORD,ea.length),N_ENSHU)).map(enshuCard).join('');
  } else {
    var arr=d[tab], n={bt4:N_BT4,keisan:N_KEISAN,kaisei:N_KAISEI}[tab];
    var pick=showAll?arr:win(arr,mod(ORD,arr.length),n);
    h=pick.map(function(o){return card(o, tab==='bt4'?'bt4':'');}).join('');
  }
  document.getElementById('app').innerHTML=h||'<div class="empty">項目がありません</div>';
}

document.getElementById('meta').textContent=
  (WEEK?('第'+WEEK+'週／理論 '+UNLOCKED+'／'+DATA.theory.length+'題 解禁'):'助走期間')
  +'　本試験まであと '+(EXAM-ORD)+' 日';

document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-selected','false');});
    b.setAttribute('aria-selected','true'); tab=b.dataset.t; render();});
});
document.getElementById('app').addEventListener('click',function(e){
  if(e.target.classList.contains('b')) e.target.classList.toggle('on');
  if(e.target.classList.contains('reveal')){
    var a=e.target.nextElementSibling; a.hidden=!a.hidden;
    e.target.textContent=a.hidden?'解答を見る':'解答を隠す';}});
document.getElementById('revealAll').addEventListener('click',function(){
  document.querySelectorAll('.b').forEach(function(x){x.classList.add('on');});
  document.querySelectorAll('.card.enshu .a').forEach(function(x){x.hidden=false;});
  document.querySelectorAll('.card.enshu .reveal').forEach(function(x){x.textContent='解答を隠す';});});
document.getElementById('hideAll').addEventListener('click',function(){
  document.querySelectorAll('.b').forEach(function(x){x.classList.remove('on');});
  document.querySelectorAll('.card.enshu .a').forEach(function(x){x.hidden=true;});
  document.querySelectorAll('.card.enshu .reveal').forEach(function(x){x.textContent='解答を見る';});});
document.getElementById('scope').addEventListener('click',function(){
  showAll=!showAll; this.textContent=showAll?'本日の範囲に戻す':'全範囲を表示';
  document.getElementById('scopeLabel').textContent=showAll?'全範囲':''; render();});
render();
</script>
